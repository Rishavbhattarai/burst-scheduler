name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo scripts/install-nats-server.sh
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: unit and end-to-end tests (real nats-server)
        run: pytest -m "not k8s" -rs

  kubernetes:
    name: Kubernetes backend on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: burst
      - run: sudo scripts/install-nats-server.sh
      - run: pip install -e ".[dev]"
      - name: preload the test image (optional, the node can also pull it)
        run: docker pull busybox:1.36 && kind load docker-image busybox:1.36 --name burst || true
      - name: jobs on a real cluster, and the controller bursting into it
        run: pytest -m k8s -rs
        env:
          BURST_K8S_CONTEXT: kind-burst

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build   # type check + production build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: dashboard and API answer, jobs run locally and burst to the simulated cloud
        run: scripts/smoke.sh
      - if: failure()
        run: docker compose logs --tail 100
