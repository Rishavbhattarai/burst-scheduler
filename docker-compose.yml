# Local cluster: NATS (JetStream), the controller (REST API on :8000) and two workers.
#   docker compose up --build
#   docker compose up --scale worker=4    # more local capacity
services:
  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 15

  controller:
    build: .
    command: ["burst-controller"]
    environment:
      BURST_NATS_URL: nats://nats:4222
      # burst policy and cloud backends; the example bursts to the simulated backend
      BURST_CONFIG: ${BURST_CONFIG:-/app/burst.example.toml}
    volumes: [controller-data:/data]
    ports: ["8000:8000"]
    depends_on:
      nats: {condition: service_healthy}

  worker:
    build: .
    command: ["burst-worker"]
    environment:
      BURST_NATS_URL: nats://nats:4222
      BURST_WORKER_SLOTS: "2"
    deploy:
      replicas: 2
    stop_grace_period: 15s
    depends_on:
      nats: {condition: service_healthy}

volumes:
  nats-data:
  controller-data:
