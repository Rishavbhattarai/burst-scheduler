[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "burst-scheduler"
version = "0.1.0"
description = "A small job queue that runs on local workers and bursts to the cloud when the wait gets too long"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "nats-py>=2.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff"]

[project.scripts]
burst-controller = "burst.controller:main"
burst-worker = "burst.worker:main"

[tool.setuptools.packages.find]
include = ["burst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a nats-server binary (skipped otherwise)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
